# FTAS Docker 编排：构建镜像并以环境变量驱动运行时配置
services:
  ftas:
    build: .
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data/cache:/app/data/cache
    environment:
      APP_PORT: "${APP_PORT:-8000}"
      FTAS_CACHE_DIR: "${FTAS_CACHE_DIR:-/app/data/cache}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.deepseek.com/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-60}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-3}"
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-60}"
      MAX_PROMPT_CHARS: "${MAX_PROMPT_CHARS:-8000}"
